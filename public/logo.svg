<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background shape -->
  <polygon points="100,10 190,60 190,140 100,190 10,140 10,60" 
           fill="url(#logoGrad)" 
           stroke="#0ea5e9" 
           stroke-width="2"
           opacity="0.15"/>
  
  <!-- Network lines background -->
  <g stroke="#0ea5e9" stroke-width="1" opacity="0.4" fill="none">
    <line x1="30" y1="50" x2="70" y2="80" />
    <line x1="70" y1="80" x2="50" y2="120" />
    <line x1="50" y1="120" x2="90" y2="150" />
    <line x1="130" y1="50" x2="170" y2="80" />
    <line x1="170" y1="80" x2="150" y2="120" />
    <line x1="150" y1="120" x2="110" y2="150" />
    <line x1="70" y1="80" x2="130" y2="80" />
    <line x1="90" y1="150" x2="110" y2="150" />
  </g>
  
  <!-- Network dots -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="30" cy="50" r="4"/>
    <circle cx="70" cy="80" r="5"/>
    <circle cx="50" cy="120" r="4"/>
    <circle cx="90" cy="150" r="5"/>
    <circle cx="130" cy="80" r="5"/>
    <circle cx="110" cy="150" r="5"/>
    <circle cx="150" cy="120" r="4"/>
    <circle cx="170" cy="80" r="4"/>
    <circle cx="130" cy="50" r="4"/>
  </g>
  
  <!-- M Letter -->
  <path d="M 35 140 L 35 70 L 65 110 L 95 70 L 95 140" 
        fill="none" 
        stroke="url(#letterGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- K Letter -->
  <path d="M 115 140 L 115 70 M 115 105 L 155 70 M 115 105 L 155 140" 
        fill="none" 
        stroke="url(#letterGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Circuit accents -->
  <g stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 10 60 L 25 60"/>
    <circle cx="25" cy="60" r="2" fill="#0ea5e9"/>
    <path d="M 175 60 L 190 60"/>
    <circle cx="175" cy="60" r="2" fill="#0ea5e9"/>
    <path d="M 100 10 L 100 25"/>
    <circle cx="100" cy="25" r="2" fill="#0ea5e9"/>
    <path d="M 100 175 L 100 190"/>
    <circle cx="100" cy="175" r="2" fill="#0ea5e9"/>
  </g>
</svg>
